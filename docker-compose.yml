services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cemis-app
    restart: unless-stopped
    env_file:
      - .env.docker
    volumes:
      - public:/var/www/html/public
      - storage:/var/www/html/storage
    entrypoint: ["/var/www/html/docker/entrypoint.sh"]
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - cemis

  nginx:
    image: nginx:alpine
    container_name: cemis-nginx
    restart: unless-stopped
    ports:
      - "${DOCKER_APP_PORT:-8080}:80"
    volumes:
      - public:/var/www/html/public
      - storage:/var/www/html/storage
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - cemis

  mysql:
    image: mysql:8
    container_name: cemis-mysql
    restart: unless-stopped
    env_file:
      - .env.docker
    ports:
      - "${DOCKER_DB_PORT:-3308}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - cemis

volumes:
  mysql_data:
  public:
  storage:

networks:
  cemis:
    driver: bridge
